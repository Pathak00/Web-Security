<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSecurity</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .spinner {
            display: none;
            border: 16px solid #f3f3f3;
            /* Light grey */
            border-top: 16px solid #3498db;
            /* Blue */
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading {
            display: block;
        }

        body {
            background-color: #1F1A3D;
            /* Lavender blue background */
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #17153B;
            /* Steel blue color to match body */
            padding: 1rem 0;
            /* Increased vertical padding */
        }

        .navbar-brand {
            color: #fff;
            /* White text color */
        }

        .navbar-brand .motto {
            font-size: 0.9rem;
            /* Slightly smaller font size for the motto */
            color: #fff;
            /* White text color */
            font-weight: 300;
            /* Lighter font weight */
        }

        .navbar-nav .nav-link {
            color: #fff;
            /* White text color */
        }

        .navbar-nav .nav-link:hover {
            color: #9290C3;
            /* Lavender blue color on hover */
            background-color: #1B1A55;
            /* Navy blue background on hover */
        }

        .search-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            background-color: #fff;
            text-align: center;
        }

        .search-box input[type="text"] {
            width: 80%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 18px;
        }

        .search-box button {
            width: 18%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            background: #191477;
            /* Steel blue color */
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #1B1A55;
            /* Navy blue color for hover */
        }

        .modal-content {
            background: #17153B;
            /* Dark navy background */
            border-radius: 8px;
            border: 1px solid #433D8B;
            /* Lighter navy border */
        }

        .modal-header {
            background: #2E236C;
            /* Medium navy color */
            color: #C8ACD6;
            /* Light lavender text color */
            border-bottom: none;
        }

        .modal-header .close {
            color: #C8ACD6;
            /* Light lavender color */
        }

        .modal-body {
            padding: 2rem;
            background: #17153B;
            /* Dark navy background */
            color: #C8ACD6;
            /* Light lavender text color */
        }

        .modal-body .form-control {
            background: #2E236C;
            /* Medium navy background */
            color: #C8ACD6;
            /* Light lavender text color */
            border: 1px solid #433D8B;
            /* Lighter navy border */
        }

        .modal-body .form-control::placeholder {
            color: #C8ACD6;
            /* Light lavender placeholder text color */
        }

        .modal-body .btn-primary {
            background-color: #433D8B;
            /* Lighter navy color */
            border: none;
            color: #C8ACD6;
            /* Light lavender text color */
        }

        .modal-body .btn-primary:hover {
            background-color: #2E236C;
            /* Medium navy color for hover */
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand">WebSecurity
                <div class="motto">Scan Vulnerabilities, Stay Safe</div>
            </a>
            <!-- Navbar with Sign Up link -->
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ml-auto">
                    <!-- Login link that triggers Login Modal -->
                    <li class="nav-item">
                        <a class="nav-link" href="login">Login</a>
                    </li>

                    <!-- Sign Up link that triggers Sign Up Modal -->
                    <li class="nav-item">
                        <a class="nav-link" href="register">Sign Up</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <div id="downloadSection" style="display: none; text-align: center;">
        <button class="download-btn" onclick="downloadPDF()">Download Scan Report</button>
    </div>


    {% if pdf_url %}
    <h2>Generated PDF Report</h2>
    <button onclick="window.open('{{ pdf_url }}', '_blank')">Open PDF in New Window</button>
    {% endif %}

    <!-- Search Box -->
    <div class="search-container">
        <div class="search-box">
            <h2>Enter Your Domain</h2>
            <form method="POST" action="">
                {% csrf_token %}
                <input type="text" name="name" placeholder="Scan Vulnerabilities...">
                <button type="submit">Search</button>
            </form>
        </div>
    </div>



    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form method="POST" action="{% url 'dashboard' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="loginUsername">Username</label>
                            <input type="text" class="form-control" id="loginUsername" name="loginUsername"
                                placeholder="Enter username" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input type="password" class="form-control" id="loginPassword" name="loginPassword"
                                placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                        {% if error %}
                        <p class="text-danger">{{error}}</p>
                        {%endif%}
                    </form>
                </div>
            </div>
        </div>
    </div>






    <div id="loading-spinner" class="spinner"></div>

    <div id="result-container"></div>




    <script>
        document.getElementById('crawler-form').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent default form submission


            const domain = document.getElementById('domainInput').value.trim();
            if (domain) {
                generateReport(domain);
            }
        });


        function generateReport(domain) {
            if (!scanResults[domain]) {
                alert('No scan results found for this domain.');
                return;
            }

            // Check if the user is logged in
            if (!isLoggedIn) {
                alert('You must be logged in to download the report.');
                return;
            }

            const result = scanResults[domain];
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.text("Vulnerability Scan Report", 20, 20);
            doc.setFontSize(12);
            doc.text(`Website: ${domain}`, 20, 30);
            doc.text(`Scan Date: ${result.scanDate}`, 20, 40);
            doc.text(`Severity: ${result.severity}`, 20, 50);
            doc.text(`Vulnerabilities Found:`, 20, 60);

            let yOffset = 70;
            result.vulnerabilities.forEach((vulnerability, index) => {
                doc.text(`${index + 1}. ${vulnerability}`, 20, yOffset);
                yOffset += 10;
            });

            // Show the download button
            document.getElementById('downloadSection').style.display = 'block';

            // Store the generated report in a variable (for download later)
            window.generatedPDF = doc;
        }



        function downloadPDF() {
            if (window.generatedPDF) {
                window.generatedPDF.save('scan_report.pdf');
            }
        }

        document.getElementById('crawler-form').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent default form submission

            var form = event.target;
            var formData = new FormData(form);
            var xhr = new XMLHttpRequest();

            xhr.open('POST', form.action, true);
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.setRequestHeader('X-CSRFToken', formData.get('csrfmiddlewaretoken'));

            xhr.onload = function () {
                if (xhr.status >= 200 && xhr.status < 300) {
                    // Hide the spinner and show the result
                    document.getElementById('loading-spinner').classList.remove('loading');
                    document.getElementById('result-container').innerHTML = xhr.responseText;
                } else {
                    // Handle errors
                    console.error('Request failed. Returned status of ' + xhr.status);
                }
            };

            xhr.onerror = function () {
                console.error('Request failed');
            };

            // Show the spinner and send the request
            document.getElementById('loading-spinner').classList.add('loading');
            xhr.send(formData);




        });
    </script>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        window.onload = function () {
            const errorMessage = "{{ error|escapejs }}";  // Safely escape the error message
            if (errorMessage) {
                alert("Invalid login");  // Show alert with the error message
            }
        };</script>
</body>

</html>
